<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        header {
            background-color: #007BFF;
            color: white;
            padding: 20px 0;
            font-size: 32px;
            font-weight: bold;
        }
        .content {
            margin-top: 50px;
        }
        .image-container {
            display: flex;
            flex-direction: column; /* Stack images vertically */
            gap: 20px;
            margin-top: 20px;
            padding: 10px;
        }
        .image-container img {
            max-width: 300px;
            border: 2px solid black;
            margin: 0 auto; /* Center images horizontally */
        }
        .items-list {
            margin: 20px auto;
            text-align: left;
            max-width: 600px;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .items-list h3 {
            margin-top: 0;
        }
        .items-list ul {
            list-style-type: none;
            padding: 0;
        }
        .items-list ul li {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <header>R2R Movers</header>
    <h2>Processed Images</h2>

    <div class="content">
        <!-- Display the list of items found -->
        <div class="items-list">
            <h3>Items Found in Processed Images:</h3>
            <ul>
                {% for item, count in items %}
                    <li>{{ item }}: {{ count }}</li>
                {% endfor %}
            </ul>
        </div>

        <!-- Display the processed images -->
        <div class="image-container">
            {% for image in images %}
                <img src="{{ image }}" alt="Processed Image">
            {% endfor %}
        </div>
    </div>

</body>
</html>
